version: 2
updates:
  # Ecosistema "uv": aggiorna pyproject.toml + uv.lock insieme.
  # Nota: il supporto uv è arrivato dopo quello pip — verifica che le PR si
  # aprano davvero nelle prime settimane; se non lo fanno, il fallback è Renovate.
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  # npm (frontend): package.json + package-lock.json insieme.
  # Patch e minor fluiscono da sole; le major del toolchain si muovono a
  # mano, in modo coordinato — come le basi delle immagini Docker:
  #   - @types/node segue la major del runtime (node:24-alpine);
  #   - typescript major (6/7: la 7 è il rewrite nativo) va validata col
  #     build di Next e con eslint-config-next;
  #   - eslint major deve aspettare il supporto di eslint-config-next.
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    # La major della base deve muoversi insieme a requires-python e al lock:
    # si migra a mano, in un'unica PR (pyproject.toml + uv lock + Dockerfile).
    # Patch e aggiornamenti di digest di 3.13-slim restano automatici —
    # sono gli aggiornamenti di sicurezza della base.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    # Stessa policy del backend: la major di node si migra a mano (va
    # coordinata con l'engine richiesto da Next), patch e digest automatici.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Il digest di caddy è la via di remediation per le CVE del binario Go:
  # quando upstream rilancia con Go patchato, è la PR di Dependabot a portarla.
  - package-ecosystem: docker
    directory: /caddy
    schedule: { interval: weekly }
    ignore:
      - dependency-name: caddy
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
