version: 2
updates:
  # Ecosistema "uv": aggiorna pyproject.toml + uv.lock insieme.
  # Nota: il supporto uv è arrivato dopo quello pip — verifica che le PR si
  # aprano davvero nelle prime settimane; se non lo fanno, il fallback è Renovate.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # La major della base deve muoversi insieme a requires-python e al lock:
    # si migra a mano, in un'unica PR (pyproject.toml + uv lock + Dockerfile).
    # Patch e aggiornamenti di digest di 3.13-slim restano automatici —
    # sono gli aggiornamenti di sicurezza della base.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
